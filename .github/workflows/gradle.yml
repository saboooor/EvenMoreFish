# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Verify separate addon packaging
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        from zipfile import ZipFile
        plugins = list(Path("even-more-fish-plugin/build/libs").glob("*.jar"))
        assert plugins, "Server plugin JAR missing"
        for plugin in plugins:
            with ZipFile(plugin) as archive:
                assert not any(name.startswith("addons/") for name in archive.namelist()), "Server plugin contains embedded addons"
        addons = list(Path("addons/even-more-fish-addons-excellenteconomy/build/libs").glob("*.jar"))
        assert addons, "Standalone ExcellentEconomy addon JAR missing"
        for addon in addons:
            with ZipFile(addon) as archive:
                assert "org/evenmorefish/fish/addons/ExcellentEconomyAddonLoader.class" in archive.namelist()
                assert "plugin.yml" not in archive.namelist(), "Native addon packaged as a server plugin"
        PYCODE

    - name: Upload server plugin
      uses: actions/upload-artifact@v4
      with:
        name: EvenMoreFish-plugin
        if-no-files-found: error
        path: even-more-fish-plugin/build/libs/*.jar

    - name: Upload optional addons
      uses: actions/upload-artifact@v4
      with:
        name: EvenMoreFish-addons
        if-no-files-found: error
        path: addons/even-more-fish-addons-*/build/libs/*.jar

    - name: Upload Gradle test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-test-reports-${{ github.run_attempt }}
        retention-days: 14
        if-no-files-found: warn
        path: |
          **/build/reports/tests/
          **/build/test-results/test/
          **/build/reports/problems/

  dependency-submission:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
